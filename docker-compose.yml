services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paycore-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      APP_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: paycore
      DB_PASSWORD: paycore
      DB_NAME: paycore
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    container_name: paycore-postgres
    restart: always
    environment:
      POSTGRES_USER: paycore
      POSTGRES_PASSWORD: paycore
      POSTGRES_DB: paycore
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: paycore-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: